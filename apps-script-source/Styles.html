<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
:root{--navy:#14213d;--blue:#2563eb;--bg:#f3f6fb;--line:#e5eaf2;--muted:#718096}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:'Hind Siliguri',Arial,sans-serif}.topbar{background:linear-gradient(115deg,#14213d,#263f72);color:white;padding:18px max(22px,calc((100% - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:24px;font-weight:700}.sub{font-size:13px;opacity:.8}.wrap{max-width:1240px;margin:26px auto;padding:0 18px}.primary{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}.topbar .primary{background:#fff!important;color:#17346b!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.tablebox{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 4px 15px #1c355508}.stat{padding:17px 19px}.stat span{display:block;color:var(--muted);font-size:13px}.stat b{display:block;font-size:23px;margin-top:5px}.green{color:#07865c!important}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.toolbar input{flex:1;min-width:220px}input,textarea,button{font:inherit}input,textarea{border:1px solid #d9e0ea;border-radius:8px;padding:10px 12px;background:#fff;min-width:0}button{border:1px solid #d9e0ea;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer;color:#26344d}button:hover{filter:brightness(.97)}button:disabled{opacity:.6;cursor:wait}.tablehead{padding:16px 18px;display:flex;align-items:center;justify-content:space-between}.tablehead h2{margin:0;font-size:19px}.tablehead span{color:var(--muted);font-size:13px}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:950px}th,td{text-align:left;padding:11px 12px;border-top:1px solid var(--line);font-size:13px;white-space:nowrap}th{background:#f8faff;color:#5c6880;font-weight:600}td b{font-size:14px}.thumb{width:42px;height:42px;object-fit:cover;border-radius:8px}.noimg{display:inline-grid;place-items:center;width:42px;height:42px;background:#f0f3f8;border-radius:8px}.stock{padding:3px 9px;border-radius:20px;background:#e8f7ef;color:#08794f}.stock.low{background:#fff0e9;color:#c34d1c}.rowactions{display:flex;gap:5px}.rowactions button{padding:5px 8px;font-size:12px}.danger{color:#c43d45}.desc,small{display:block;color:var(--muted);font-size:11px;white-space:normal;max-width:220px}.empty{text-align:center;padding:35px;color:var(--muted)}.foot{text-align:center;color:var(--muted);font-size:12px;margin:20px}.modal{position:fixed;inset:0;background:#101a2c88;display:grid;place-items:center;padding:15px;z-index:5}.modal[hidden]{display:none}.dialog{background:#fff;border-radius:15px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px #0003}.compact{width:min(420px,100%)}.dialoghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.dialoghead h2{margin:0;font-size:20px}.x{border:0;font-size:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formgrid label,.compact label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}.formgrid input,.formgrid textarea,.compact input{width:100%}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#17243d;color:white;padding:10px 18px;border-radius:9px;transition:.2s;z-index:9;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}

</style>
